<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas 最佳实践示例</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }

      .canvas-container {
        position: relative;
        margin: 20px 0;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      canvas {
        display: block;
      }

      .controls {
        margin: 15px 0;
        display: flex;
        gap: 10px;
      }

      button {
        padding: 8px 12px;
        background: #4c7ef3;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.3s;
      }

      button:hover {
        background: #3867d6;
      }
    </style>
  </head>
  <body>
    <h1>Canvas 图形绘制演示</h1>

    <div class="canvas-container">
      <canvas id="myCanvas" width="600" height="400"></canvas>
    </div>

    <div class="controls">
      <button id="drawShapes">绘制基本形状</button>
      <button id="drawGradient">绘制渐变</button>
      <button id="startAnimation">启动动画</button>
      <button id="saveImage">保存图像</button>
    </div>

    <script>
      // 1. 最佳实践：封装 Canvas 操作为可重用类
      class CanvasManager {
        constructor(canvasId) {
          this.canvas = document.getElementById(canvasId);
          // 最佳实践：检查浏览器支持
          if (!this.canvas.getContext) {
            throw new Error("您的浏览器不支持Canvas!");
          }
          this.ctx = this.canvas.getContext("2d");

          // 最佳实践：处理高分辨率显示器
          this.handleHiDPI();

          // 动画相关
          this.animationId = null;
          this.circles = [];
        }

        // 最佳实践：支持高分辨率显示
        handleHiDPI() {
          const dpr = window.devicePixelRatio || 1;
          if (dpr > 1) {
            const rect = this.canvas.getBoundingClientRect();

            // 设置显示尺寸
            this.canvas.style.width = rect.width + "px";
            this.canvas.style.height = rect.height + "px";

            // 设置实际画布尺寸
            this.canvas.width = rect.width * dpr;
            this.canvas.height = rect.height * dpr;

            // 缩放上下文
            this.ctx.scale(dpr, dpr);
          }
        }

        // 最佳实践：清除画布方法
        clear() {
          this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        }

        // 绘制基本形状
        drawShapes() {
          this.clear();

          // 矩形
          this.ctx.fillStyle = "#4c7ef3";
          this.ctx.fillRect(50, 50, 100, 100);

          // 描边矩形
          this.ctx.strokeStyle = "#f34c7e";
          this.ctx.lineWidth = 5;
          this.ctx.strokeRect(200, 50, 100, 100);

          // 圆形
          this.ctx.beginPath();
          this.ctx.arc(425, 100, 50, 0, Math.PI * 2);
          this.ctx.fillStyle = "#7ef34c";
          this.ctx.fill();

          // 路径
          this.ctx.beginPath();
          this.ctx.moveTo(50, 200);
          this.ctx.lineTo(150, 300);
          this.ctx.lineTo(50, 300);
          this.ctx.closePath(); // 关闭路径（连回起点）
          this.ctx.fillStyle = "#f3db4c";
          this.ctx.fill();

          // 贝塞尔曲线
          this.ctx.beginPath();
          this.ctx.moveTo(200, 200);
          this.ctx.bezierCurveTo(250, 150, 350, 150, 400, 200);
          this.ctx.bezierCurveTo(450, 250, 350, 350, 200, 300);
          this.ctx.closePath();
          this.ctx.fillStyle = "#4cf3db";
          this.ctx.fill();

          // 文本
          this.ctx.font = "bold 24px Arial";
          this.ctx.fillStyle = "#333";
          this.ctx.textAlign = "center";
          this.ctx.fillText("Canvas 基本形状", 300, 350);
        }

        // 绘制渐变
        drawGradient() {
          this.clear();

          // 线性渐变
          const linearGradient = this.ctx.createLinearGradient(
            50,
            50,
            250,
            250
          );
          linearGradient.addColorStop(0, "#f34c7e");
          linearGradient.addColorStop(0.5, "#4c7ef3");
          linearGradient.addColorStop(1, "#7ef34c");

          this.ctx.fillStyle = linearGradient;
          this.ctx.fillRect(50, 50, 200, 200);

          // 径向渐变
          const radialGradient = this.ctx.createRadialGradient(
            425,
            150,
            10,
            425,
            150,
            80
          );
          radialGradient.addColorStop(0, "white");
          radialGradient.addColorStop(0.25, "#f3db4c");
          radialGradient.addColorStop(1, "#f34c7e");

          this.ctx.fillStyle = radialGradient;
          this.ctx.beginPath();
          this.ctx.arc(425, 150, 80, 0, Math.PI * 2);
          this.ctx.fill();

          // 文本
          this.ctx.font = "bold 24px Arial";
          this.ctx.fillStyle = "#333";
          this.ctx.textAlign = "center";
          this.ctx.fillText("Canvas 渐变效果", 300, 350);
        }

        // 最佳实践：启动高效动画循环
        startAnimation() {
          this.clear();
          this.circles = [];

          // 创建多个圆
          for (let i = 0; i < 15; i++) {
            this.circles.push({
              x: (Math.random() * this.canvas.width) / window.devicePixelRatio,
              y: (Math.random() * this.canvas.height) / window.devicePixelRatio,
              radius: 5 + Math.random() * 20,
              dx: (Math.random() - 0.5) * 4,
              dy: (Math.random() - 0.5) * 4,
              color: `hsl(${Math.random() * 360}, 70%, 60%)`,
            });
          }

          // 停止之前的动画（如果有）
          if (this.animationId) {
            cancelAnimationFrame(this.animationId);
          }

          // 最佳实践：使用 requestAnimationFrame 而不是 setInterval
          const animate = () => {
            // 最佳实践：仅清除需要更新的区域，而不是整个画布
            this.clear();

            this.circles.forEach((circle) => {
              // 更新位置
              circle.x += circle.dx;
              circle.y += circle.dy;

              // 边界检测
              if (
                circle.x + circle.radius >
                  this.canvas.width / window.devicePixelRatio ||
                circle.x - circle.radius < 0
              ) {
                circle.dx = -circle.dx;
              }

              if (
                circle.y + circle.radius >
                  this.canvas.height / window.devicePixelRatio ||
                circle.y - circle.radius < 0
              ) {
                circle.dy = -circle.dy;
              }

              // 绘制圆
              this.ctx.beginPath();
              this.ctx.arc(circle.x, circle.y, circle.radius, 0, Math.PI * 2);
              this.ctx.fillStyle = circle.color;
              this.ctx.fill();
              this.ctx.closePath();
            });

            this.animationId = requestAnimationFrame(animate);
          };

          animate();
        }

        // 最佳实践：提供图像导出功能
        saveImage() {
          // 如果正在动画，暂停它以捕获当前帧
          if (this.animationId) {
            cancelAnimationFrame(this.animationId);
            this.animationId = null;
          }

          // 创建下载链接
          const link = document.createElement("a");
          link.download = "canvas-image.png";
          link.href = this.canvas.toDataURL("image/png");
          link.click();
        }
      }

      // 初始化 Canvas 管理器
      const canvasManager = new CanvasManager("myCanvas");

      // 事件监听
      document.getElementById("drawShapes").addEventListener("click", () => {
        canvasManager.drawShapes();
      });

      document.getElementById("drawGradient").addEventListener("click", () => {
        canvasManager.drawGradient();
      });

      document
        .getElementById("startAnimation")
        .addEventListener("click", () => {
          canvasManager.startAnimation();
        });

      document.getElementById("saveImage").addEventListener("click", () => {
        canvasManager.saveImage();
      });

      // 初始绘制
      canvasManager.drawShapes();
    </script>
  </body>
</html>
